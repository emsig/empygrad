name: linux

on:
  pull_request:
  push:
    branches:
      - main

# Cancel any previous run of the test job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[tests]"
      - name: Import
        run: python -c "import empygrad"
      - name: Flake8
        run: flake8 empygrad/ tests/
      - name: Vulture
        run: vulture empygrad/ tests/ --min-confidence 80
      - name: Test with coverage
        run: pytest --cov=empygrad tests/
